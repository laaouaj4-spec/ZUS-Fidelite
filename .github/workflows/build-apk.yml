
name: Build ZUS Fidelite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZUS Fidelite APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect project
        run: |
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradle.properties" \) -print
          echo "AndroidX properties:"
          if [ -f gradle.properties ]; then
            cat gradle.properties
          else
            echo "gradle.properties is missing from project root"
          fi

      - name: Enable AndroidX
        run: |
          if [ -f gradle.properties ]; then
            grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
            grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          else
            printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' > gradle.properties
          fi
          echo "Updated Gradle properties:"
          cat gradle.properties

      - name: Build debug APK
        env:
          ANDROID_USE_ANDROIDX: "true"
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon -Pandroid.useAndroidX=true assembleDebug
          else
            gradle --no-daemon -Pandroid.useAndroidX=true assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZUS-Fidelite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

